import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

// 一个模拟 Minecraft 1.20.1 启动流程的假游戏，只用于在拿不到原版文件的环境里测试 NeFobric。
// 两个主类保留了 NeFobric 游戏钩子依赖的特征：客户端的 “Render thread”、服务端的 “server.properties”。
sourceSets {
    client
    server
    lib
}

// 原版 1.20.1 自带、Forge 运行时依赖的几个库（版本和原版一致）。真游戏的客户端由启动器放进 classpath，
// 服务端在 bundler 里；假游戏照做，这样 Forge 运行时在测试里看到的环境和真游戏一样。
configurations {
    minecraftLibs {
        transitive = false
    }
}

dependencies {
    serverCompileOnly sourceSets.lib.output
    minecraftLibs 'org.apache.logging.log4j:log4j-api:2.19.0'
    minecraftLibs 'org.apache.logging.log4j:log4j-core:2.19.0'
    minecraftLibs 'org.slf4j:slf4j-api:2.0.1'
    minecraftLibs 'org.apache.commons:commons-lang3:3.12.0'
    // 真实模组（和它们的 Mixin 插件）常用、真游戏 classpath 上也有的库：缺了会在假游戏里提前失败，掩盖真正的问题
    minecraftLibs 'com.google.guava:guava:31.1-jre'
    minecraftLibs 'com.google.guava:failureaccess:1.0.1'
    minecraftLibs 'com.google.code.gson:gson:2.10'
    minecraftLibs 'it.unimi.dsi:fastutil:8.5.9'
}

// 给端到端测试用：客户端 classpath 上的原版库
tasks.register('clientLibs', Sync) {
    from configurations.minecraftLibs
    into layout.buildDirectory.dir('client-libs')
}

tasks.register('clientJar', Jar) {
    archiveBaseName = 'fake-minecraft-client'
    archiveVersion = '1.20.1'
    from sourceSets.client.output
}

tasks.register('serverGameJar', Jar) {
    archiveBaseName = 'fake-minecraft-server'
    archiveVersion = '1.20.1'
    from sourceSets.server.output
}

tasks.register('libJar', Jar) {
    archiveBaseName = 'fake-library'
    archiveVersion = '1.0'
    from sourceSets.lib.output
}

// 按原版 bundler 格式打包：META-INF/versions.list、libraries.list（sha256 \t id \t 路径）
tasks.register('bundlerJar') {
    def serverJar = tasks.named('serverGameJar')
    def libJar = tasks.named('libJar')
    def mcLibs = configurations.minecraftLibs
    dependsOn serverJar, libJar
    // 服务端游戏 jar 和库变了也要重新打包
    inputs.files(serverJar, libJar, mcLibs)
    def out = layout.buildDirectory.file('libs/fake-server-bundler-1.20.1.jar')
    outputs.file(out)
    doLast {
        def sha = { File f -> MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
        File game = serverJar.get().archiveFile.get().asFile
        File lib = libJar.get().archiveFile.get().asFile
        File target = out.get().asFile
        target.parentFile.mkdirs()
        new ZipOutputStream(new FileOutputStream(target)).withCloseable { zip ->
            def put = { String name, byte[] data ->
                zip.putNextEntry(new ZipEntry(name)); zip.write(data); zip.closeEntry()
            }
            put('META-INF/main-class', 'net.minecraft.server.Main'.bytes)
            put('META-INF/versions.list', "${sha(game)}\t1.20.1\t1.20.1/server-1.20.1.jar\n".bytes)
            def libs = [[lib, 'org.example:fake-library:1.0', 'org/example/fake-library/1.0/fake-library-1.0.jar']]
            mcLibs.resolvedConfiguration.resolvedArtifacts.sort { it.file.name }.each { a ->
                def id = a.moduleVersion.id
                libs << [a.file, "${id.group}:${id.name}:${id.version}",
                         "${id.group.replace('.', '/')}/${id.name}/${id.version}/${a.file.name}"]
            }
            put('META-INF/libraries.list', libs.collect { "${sha(it[0])}\t${it[1]}\t${it[2]}\n" }.join('').bytes)
            put('META-INF/versions/1.20.1/server-1.20.1.jar', game.bytes)
            libs.each { put("META-INF/libraries/${it[2]}", it[0].bytes) }
        }
    }
}

assemble.dependsOn 'clientJar', 'bundlerJar', 'clientLibs'
