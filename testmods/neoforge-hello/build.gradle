// 最简单的 NeoForge 测试模组：只有一个 @Mod 主类，构造时打印日志。
// 它同样可以直接放进真正的 NeoForge 1.20.1 里运行。
version = '1.0.0'

dependencies {
    // Forge API：编译时用 NeFobric 自己重写的版本（和 Forge 的类名、签名一致），模组 jar 里不带这些类
    compileOnly project(path: ':compat-forge', configuration: 'forgeApiElements')
}

jar {
    archiveBaseName = 'neoforge-hello'
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
